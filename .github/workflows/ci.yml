name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # CI.1 — this job now runs against a REAL database. Before CI.1 the job had no
    # DATABASE_URL, so every DB-gated check skipped itself: CI executed 868
    # assertions and skipped 122 blocks, and "CI green" was never evidence for any
    # database-backed behaviour. With Postgres + MinIO wired in, the same
    # `pnpm verify:all` executes ~1430 assertions (VERIFY.3 made it deterministic
    # and ~2 min, which is what made this affordable).
    #
    # Postgres MUST be pgvector-capable: the committed migrations carry hand-authored
    # raw-SQL DDL that plain `postgres:16` cannot run — SearchDoc FTS (`tsv` + GIN)
    # and File/SearchDoc `vector(1536)` + HNSW. Schema is applied with
    # `prisma migrate deploy` and never the push-based schema sync (MIGRATE.1: that
    # path silently drops exactly this raw-SQL DDL). The literal command name is kept
    # out of this file on purpose — verify:migrate-1 bans that string outright.
    #
    # Credentials are ephemeral service-container values, not secrets — the DB and
    # blob store live and die with the job.
    env:
      AUTH_SECRET: ci-dummy-secret-not-used-for-real-sessions-0123456789
      DATABASE_URL: postgresql://axona:axona@localhost:5432/axona
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: axona-files
      S3_ACCESS_KEY: axona
      S3_SECRET_KEY: axona-secret
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axona
          POSTGRES_PASSWORD: axona
          POSTGRES_DB: axona
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axona -d axona"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Generate the Prisma client so @axona/db (and everything typed against it)
      # type-checks — CI installs don't run `prisma generate` automatically.
      - name: Generate Prisma client
        run: pnpm --filter @axona/db db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # MinIO is a step, not a `services:` entry: service containers cannot override
      # the image's command, and minio/minio needs `server /data`. Same image as
      # docker-compose.yml so CI and local dev exercise the same blob store. Without
      # it FILE.1/FILE.2/ATTACH.1/IO.2 skip their live checks instead of running them.
      - name: Start MinIO (blob store)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=axona \
            -e MINIO_ROOT_PASSWORD=axona-secret \
            minio/minio:latest server /data
          echo "waiting for MinIO on :9000…"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO ready"; break
            fi
            if [ "$i" = "30" ]; then echo "MinIO did not start"; docker logs minio; exit 1; fi
            sleep 2
          done

      # MIGRATE.1 — `migrate deploy` ONLY. The raw-SQL DDL (FTS tsv+GIN, pgvector
      # HNSW) lives in the committed migrations; the push-based sync would drop it.
      - name: Apply migrations
        run: pnpm --filter @axona/db exec prisma migrate deploy

      # Fails the job on a pending migration or drift — the schema CI tests against
      # must be exactly the one the migrations describe.
      - name: Migration status must be clean
        run: pnpm --filter @axona/db exec prisma migrate status

      - name: Seed the demo narrative
        run: pnpm --filter @axona/db db:seed

      # Seeded File rows are metadata-only until backfilled; without this FILE.1's
      # "seeded blobs backfilled" check has no object bytes to read.
      - name: Backfill seeded blobs
        run: pnpm db:seed:blobs

      # The gate. With DATABASE_URL + S3_* set, the DB-gated checks EXECUTE rather
      # than skip. What still skips is only what genuinely isn't present: LOGIN.1's
      # runtime probe (no dev server in this job — the a11y job covers the served
      # app) and the prospect tenants whose seed configs are gitignored.
      - name: Verify scripts (against the real database)
        run: pnpm verify:all

      # AUTH.1 — build must compile: the middleware + auth routes are build-sensitive
      # (edge bundle, Auth.js). Pages are force-dynamic, so no live DB is hit.
      - name: Build
        run: pnpm --filter @axona/web build

  # A11Y.2 — the SERVED accessibility gate. Unlike `verify` (which has no DB and
  # never boots the app), this job seeds a real Postgres, builds + starts the app,
  # signs in as the seeded admin, and runs axe-core over the route set. It fails on
  # any NEW serious/critical violation (the A11Y.2 triage baseline exempts the
  # pre-existing ones), and a --selftest step proves the gate actually catches a
  # violation. This is the required check that makes the "a11y 0 on route" DoD real.
  a11y:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://axona:axona@localhost:5432/axona
      AUTH_SECRET: ci-dummy-secret-not-used-for-real-sessions-0123456789
      REDIS_URL: redis://localhost:6379
      # S3 env is present so config never throws at boot; the scanned routes never
      # hit the blob store, so no MinIO service is needed.
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: axona-files
      S3_ACCESS_KEY: axona
      S3_SECRET_KEY: axona-secret
      A11Y_BASE_URL: http://localhost:3001
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axona
          POSTGRES_PASSWORD: axona
          POSTGRES_DB: axona
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axona -d axona"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @axona/db db:generate

      - name: Apply migrations
        run: pnpm --filter @axona/db exec prisma migrate deploy

      - name: Seed the demo data
        run: pnpm --filter @axona/db db:seed

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web
        run: pnpm --filter @axona/web build

      - name: Serve + axe (selftest proves the gate, then the real scan)
        run: |
          PORT=3001 pnpm --filter @axona/web start &
          APP_PID=$!
          echo "waiting for the app on :3001…"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/login || true)
            if [ "$code" = "200" ]; then echo "app ready"; break; fi
            if [ "$i" = "60" ]; then echo "app did not start"; exit 1; fi
            sleep 2
          done
          set -e
          echo "── selftest: the gate must CATCH a seeded violation ──"
          pnpm a11y:scan --selftest
          echo "── real scan: fail on any NEW serious/critical ──"
          pnpm a11y:scan
          kill "$APP_PID" 2>/dev/null || true

  # EVAL.1 — the offline agent/prompt eval gate. Runs the scenario set with the
  # FakeModelClient (deterministic, no API key) against a seeded Postgres, so it
  # asserts the REAL tool loop + real tool output on the golden thread and fails on
  # any behavioral regression (a dropped prompt contract, an unwired tool, a broken
  # fallback). The live tier (EVAL_LIVE=1 + a real key) is opt-in and never runs here.
  eval:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://axona:axona@localhost:5432/axona
      AUTH_SECRET: ci-dummy-secret-not-used-for-real-sessions-0123456789
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axona
          POSTGRES_PASSWORD: axona
          POSTGRES_DB: axona
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axona -d axona"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @axona/db db:generate

      - name: Apply migrations
        run: pnpm --filter @axona/db exec prisma migrate deploy

      - name: Seed the demo data
        run: pnpm --filter @axona/db db:seed

      - name: Run the offline eval gate
        run: pnpm eval
