name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # AUTH.1 — a dummy AUTH_SECRET (Auth.js) + placeholder DATABASE_URL so the build
    # + typecheck resolve env at CI time (no live DB is queried — pages are dynamic).
    env:
      AUTH_SECRET: ci-dummy-secret-not-used-for-real-sessions-0123456789
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Generate the Prisma client so @axona/db (and everything typed against it)
      # type-checks — CI installs don't run `prisma generate` automatically.
      - name: Generate Prisma client
        run: pnpm --filter @axona/db db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify scripts
        run: pnpm verify:all

      # AUTH.1 — build must compile: the middleware + auth routes are build-sensitive
      # (edge bundle, Auth.js). Pages are force-dynamic, so no live DB is hit.
      - name: Build
        run: pnpm --filter @axona/web build
