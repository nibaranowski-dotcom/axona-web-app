name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # AUTH.1 — a dummy AUTH_SECRET for the Auth.js config. DATABASE_URL is
    # deliberately NOT set: the DB-gated verify checks skip cleanly without it (CI
    # has no live DB), and the build compiles without it (pages are force-dynamic,
    # Prisma connects lazily at runtime, never at build).
    env:
      AUTH_SECRET: ci-dummy-secret-not-used-for-real-sessions-0123456789
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Generate the Prisma client so @axona/db (and everything typed against it)
      # type-checks — CI installs don't run `prisma generate` automatically.
      - name: Generate Prisma client
        run: pnpm --filter @axona/db db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify scripts
        run: pnpm verify:all

      # AUTH.1 — build must compile: the middleware + auth routes are build-sensitive
      # (edge bundle, Auth.js). Pages are force-dynamic, so no live DB is hit.
      - name: Build
        run: pnpm --filter @axona/web build

  # A11Y.2 — the SERVED accessibility gate. Unlike `verify` (which has no DB and
  # never boots the app), this job seeds a real Postgres, builds + starts the app,
  # signs in as the seeded admin, and runs axe-core over the route set. It fails on
  # any NEW serious/critical violation (the A11Y.2 triage baseline exempts the
  # pre-existing ones), and a --selftest step proves the gate actually catches a
  # violation. This is the required check that makes the "a11y 0 on route" DoD real.
  a11y:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://axona:axona@localhost:5432/axona
      AUTH_SECRET: ci-dummy-secret-not-used-for-real-sessions-0123456789
      REDIS_URL: redis://localhost:6379
      # S3 env is present so config never throws at boot; the scanned routes never
      # hit the blob store, so no MinIO service is needed.
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: axona-files
      S3_ACCESS_KEY: axona
      S3_SECRET_KEY: axona-secret
      A11Y_BASE_URL: http://localhost:3001
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axona
          POSTGRES_PASSWORD: axona
          POSTGRES_DB: axona
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axona -d axona"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @axona/db db:generate

      - name: Apply migrations
        run: pnpm --filter @axona/db exec prisma migrate deploy

      - name: Seed the demo data
        run: pnpm --filter @axona/db db:seed

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web
        run: pnpm --filter @axona/web build

      - name: Serve + axe (selftest proves the gate, then the real scan)
        run: |
          PORT=3001 pnpm --filter @axona/web start &
          APP_PID=$!
          echo "waiting for the app on :3001…"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/login || true)
            if [ "$code" = "200" ]; then echo "app ready"; break; fi
            if [ "$i" = "60" ]; then echo "app did not start"; exit 1; fi
            sleep 2
          done
          set -e
          echo "── selftest: the gate must CATCH a seeded violation ──"
          pnpm a11y:scan --selftest
          echo "── real scan: fail on any NEW serious/critical ──"
          pnpm a11y:scan
          kill "$APP_PID" 2>/dev/null || true

  # EVAL.1 — the offline agent/prompt eval gate. Runs the scenario set with the
  # FakeModelClient (deterministic, no API key) against a seeded Postgres, so it
  # asserts the REAL tool loop + real tool output on the golden thread and fails on
  # any behavioral regression (a dropped prompt contract, an unwired tool, a broken
  # fallback). The live tier (EVAL_LIVE=1 + a real key) is opt-in and never runs here.
  eval:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://axona:axona@localhost:5432/axona
      AUTH_SECRET: ci-dummy-secret-not-used-for-real-sessions-0123456789
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: axona
          POSTGRES_PASSWORD: axona
          POSTGRES_DB: axona
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axona -d axona"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @axona/db db:generate

      - name: Apply migrations
        run: pnpm --filter @axona/db exec prisma migrate deploy

      - name: Seed the demo data
        run: pnpm --filter @axona/db db:seed

      - name: Run the offline eval gate
        run: pnpm eval
