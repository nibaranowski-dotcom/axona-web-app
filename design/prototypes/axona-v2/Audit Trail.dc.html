<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./styles.css">
<style>
  body{margin:0}
  ::selection{background:var(--accent)}
  .navitem{transition:background .15s,color .15s}
  .navitem:hover{background:var(--panel)}
  .navgroup summary{list-style:none}
  .navgroup summary::-webkit-details-marker{display:none}
  .navchev{transition:transform .15s;flex:none}
  .navgroup:not([open]) .navchev{transform:rotate(-90deg)}
  .profmenu{position:relative}
  .profmenu summary{list-style:none;cursor:pointer}
  .profmenu summary::-webkit-details-marker{display:none}
  .profmenu summary:hover{background:var(--panel)}
  .profmenu[open] .profchev{transform:rotate(180deg)}
  .profchev{transition:transform .15s;flex:none}
  .pm-item{transition:background .15s}
  .pm-item:hover{background:var(--panel)}
  .pm-signout{transition:border-color .15s,color .15s}
  .pm-signout:hover{border-color:var(--ink-strong);color:var(--ink)}
  .auditrow:hover{background:var(--panel-2)}
  .fchip{transition:border-color .15s,color .15s;cursor:pointer}
  .fchip:hover{border-color:var(--ink-strong);color:var(--ink)}
  .set-input{transition:border-color .15s,box-shadow .15s}
  .set-input:focus-within{border-color:var(--ink-strong);box-shadow:0 0 0 3px var(--accent)}
  .scarea::-webkit-scrollbar{width:8px}
  .scarea::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}
</style>
</helmet>
<div style="display:flex;height:100vh;overflow:hidden;font-family:var(--font-sans);color:var(--ink);background:var(--panel)">

  <aside style="width:240px;flex:none;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px">
    <div style="display:flex;align-items:center;gap:8px;padding:4px 8px 18px">
      <span style="font-size:21px;font-weight:700;letter-spacing:-.04em;color:var(--ink-strong)">axona</span>
      <span style="width:12px;height:12px;background:var(--ink-strong);border-radius:0 7px 0 7px"></span>
    </div>
    <a href="Mission Control.dc.html" style="display:flex;align-items:center;gap:9px;margin:0 4px 10px;padding:8px 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel);cursor:pointer;text-decoration:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink-faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <span style="flex:1;font-size:13px;color:var(--ink-faint)">Search</span>
      <span style="font-family:var(--font-mono);font-size:9.5px;color:var(--ink-faint);border:1px solid var(--line-strong);border-radius:4px;padding:1px 5px">⌘K</span>
    </a>
    <div class="scarea" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin:0 -4px;padding:0 4px">
      <sc-for list="{{ navGroups }}" as="g" hint-placeholder-count="4">
        <details open="open" class="navgroup">
          <summary style="display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase;padding:14px 10px 6px;cursor:pointer"><span style="flex:1">{{ g.label }}</span><svg class="navchev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--line-strong)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></summary>
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
          <a class="navitem" href="{{ it.href }}" style="display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;cursor:pointer;background:transparent;color:var(--ink-muted);font-size:14px;text-decoration:none">
            <span style="width:6px;height:6px;border-radius:2px;background:var(--line-strong);flex:none"></span>
            <span style="flex:1">{{ it.name }}</span>
            <sc-if value="{{ it.badge }}" hint-placeholder-val="{{ false }}"><span style="font-family:var(--font-mono);font-size:10px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px;font-weight:600">{{ it.badge }}</span></sc-if>
          </a>
        </sc-for>
        </details>
      </sc-for>
    </div>
    <details class="profmenu" style="border-top:1px solid var(--line);margin-top:8px;padding-top:8px">
      <summary style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px">
        <span style="width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--accent-ink);flex:none">LC</span>
        <div style="flex:1;min-width:0;font-size:12.5px;line-height:1.3"><div style="font-weight:600">Lauren C.</div><div style="color:var(--ink-faint)">Head of Ops</div></div>
        <svg class="profchev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--ink-faint)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"></path></svg>
      </summary>
      <div style="position:absolute;bottom:calc(100% + 8px);left:0;right:0;background:var(--paper);border:1px solid var(--line);border-radius:13px;box-shadow:0 18px 40px rgba(0,0,0,.12);padding:6px;z-index:40">
        <a class="pm-item" href="Audit Trail.dc.html" style="display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:500;background:var(--panel)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg>
          <span style="flex:1">Audit trail</span>
        </a>
        <a class="pm-item" href="Notifications.dc.html" style="display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:500">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M10.268 21a2 2 0 0 0 3.464 0"></path><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"></path></svg>
          <span style="flex:1">Notifications</span>
          <span style="font-family:var(--font-mono);font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:2px 9px">5</span>
        </a>
        <a class="pm-item" href="Settings — Organization.dc.html" style="display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:500">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <span style="flex:1">Settings</span>
        </a>
        <div style="height:1px;background:var(--line);margin:6px 4px"></div>
        <div style="display:flex;align-items:center;gap:10px;padding:8px 10px">
          <span style="width:30px;height:30px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--accent-ink);flex:none">LC</span>
          <div style="flex:1;min-width:0;font-size:12.5px;line-height:1.3"><div style="font-weight:600">Lauren C.</div><div style="color:var(--ink-faint)">Admin</div></div>
          <a class="pm-signout" href="Login.dc.html" title="Sign out" style="width:32px;height:32px;border:1px solid var(--line-strong);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-muted);text-decoration:none;flex:none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg></a>
        </div>
      </div>
    </details>
  </aside>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <div style="height:60px;flex:none;border-bottom:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 24px">
      <div>
        <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase">Workspace · immutable log</div>
        <h1 style="margin:2px 0 0;font-size:19px;font-weight:600;letter-spacing:-.02em">Audit trail</h1>
      </div>
      <button class="fchip" style="display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;font-family:var(--font-sans);color:var(--ink-muted);background:var(--paper);border:1px solid var(--line-strong);border-radius:8px;padding:8px 14px;cursor:pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="M7 10l5 5 5-5"></path><path d="M12 15V3"></path></svg>Export CSV</button>
    </div>

    <!-- filter bar -->
    <div style="flex:none;display:flex;align-items:center;gap:12px;padding:13px 24px;border-bottom:1px solid var(--line);background:var(--paper);flex-wrap:wrap">
      <div class="set-input" style="display:flex;align-items:center;gap:9px;flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;padding:0 12px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink-faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input placeholder="Search actor, action, or object" style="flex:1;min-width:0;border:none;outline:none;background:transparent;padding:10px 0;font-size:13px;font-family:var(--font-sans);color:var(--ink)">
      </div>
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="3">
        <span class="fchip" style="display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;padding:8px 13px;border-radius:999px;background:{{ f.bg }};color:{{ f.fg }};border:1px solid {{ f.bd }}">{{ f.label }}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></span>
      </sc-for>
    </div>

    <div class="scarea" style="flex:1;min-width:0;overflow-y:auto;padding:0 0 24px">
      <div style="max-width:1000px;margin:0 auto;padding:0 24px">
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="2">
          <div style="display:flex;align-items:center;gap:12px;margin:20px 0 4px">
            <span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase">{{ d.label }}</span>
            <span style="flex:1;height:1px;background:var(--line)"></span>
          </div>
          <sc-for list="{{ d.events }}" as="e" hint-placeholder-count="5">
            <div class="auditrow" style="display:grid;grid-template-columns:150px 1fr 150px 84px;gap:14px;padding:12px 12px;align-items:center;border-bottom:1px solid var(--line)">
              <div style="display:flex;align-items:center;gap:9px;min-width:0">
                <span style="width:26px;height:26px;border-radius:50%;background:{{ e.avBg }};display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:9px;font-weight:700;color:{{ e.avFg }};flex:none">{{ e.initials }}</span>
                <span style="font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ e.actor }}</span>
              </div>
              <div style="min-width:0;font-size:13px;color:var(--ink);line-height:1.4">{{ e.action }} <span style="font-family:var(--font-mono);font-size:11.5px;color:var(--ink-muted)">{{ e.object }}</span></div>
              <span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.03em;color:var(--ink-muted);background:var(--panel);border:1px solid var(--line-panel);border-radius:5px;padding:2px 7px;justify-self:start">{{ e.module }}</span>
              <span style="font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);text-align:right">{{ e.time }}</span>
            </div>
          </sc-for>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const navGroups = [
      { label:'Core', items:[ { name:'Command Center', href:'Mission Control.dc.html' }, { name:'Agents', href:'Agents.dc.html' }, { name:'Workflows', href:'Workflows.dc.html' }, { name:'Projects', href:'Projects.dc.html' }, { name:'Machines', href:'Machines.dc.html' } ] },
      { label:'Value chain', items:[ { name:'Procurement', href:'Procurement.dc.html', badge:'6' }, { name:'Manufacturing', href:'Manufacturing.dc.html' }, { name:'Inventory', href:'Inventory.dc.html' }, { name:'Fulfillment', href:'Fulfillment.dc.html', badge:'3' }, { name:'Quality', href:'Quality.dc.html' }, { name:'Sales & CRM', href:'Sales & CRM.dc.html' }, { name:'Marketing', href:'Marketing.dc.html' } ] },
      { label:'Robotics', items:[ { name:'Fleet', href:'Fleet.dc.html' }, { name:'Field Service', href:'Field Service.dc.html' }, { name:'Engineering', href:'Engineering.dc.html' }, { name:'Autonomy', href:'Autonomy.dc.html' } ] },
      { label:'Back office', items:[ { name:'Finance', href:'Finance.dc.html', badge:'6' }, { name:'People', href:'People.dc.html' }, { name:'Security', href:'Security.dc.html' }, { name:'Legal', href:'Legal.dc.html' } ] },
    ];

    const filterRaw = [ { label:'All actors', active:true }, { label:'All modules' }, { label:'Last 7 days' } ];
    const filters = filterRaw.map(f => ({ label:f.label,
      bg: f.active ? 'var(--ink-strong)' : 'var(--paper)',
      fg: f.active ? '#fff' : 'var(--ink-muted)',
      bd: f.active ? 'var(--ink-strong)' : 'var(--line-strong)' }));

    const agent = { avBg:'var(--ink-strong)', avFg:'#fff' };
    const human = { avBg:'var(--accent)', avFg:'var(--accent-ink)' };
    const ev = (initials, actor, action, object, module, time, who) => ({ initials, actor, action, object, module, time, ...(who==='agent'?agent:human) });

    const days = [
      { label:'Today · Jul 7', events:[
        ev('LC','Lauren Chen','approved','PO-9007','PROCUREMENT','10:12', 'human'),
        ev('SA','Sourcing agent','drafted','PO-10482 → Vendor A','PROCUREMENT','09:41', 'agent'),
        ev('OH','Omar Haddad','released','ECO-318','ENGINEERING','09:20', 'human'),
        ev('CA','Customs agent','filed','EAR99 license · DLV-3312','FULFILLMENT','08:55', 'agent'),
        ev('LC','Lauren Chen','changed role','Dana Reyes → SALES','MEMBERS','08:30', 'human'),
      ] },
      { label:'Yesterday · Jul 6', events:[
        ev('PA','Policy agent','staged rollback','Site-3 · p-13 → p-12.4','AUTONOMY','18:02', 'agent'),
        ev('DR','Dana Reyes','sent','Quote · BMW 24× HX-2','SALES & CRM','16:20', 'human'),
        ev('QA','QA agent','opened','NCR-118 · lot 88421','QUALITY','14:47', 'agent'),
        ev('MO','M. Osei','closed','WO-4471 · SN-2196','FIELD SERVICE','11:15', 'human'),
        ev('LC','Lauren Chen','enabled module','Autonomy','ORGANIZATION','09:03', 'human'),
      ] },
    ];

    return { navGroups, filters, days };
  }
}
</script>
</body>
</html>
