<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./styles.css">
<style>
  body{margin:0}
  ::selection{background:var(--accent)}
  .dotfield{background-color:var(--paper);background-image:radial-gradient(#d9d8d2 1.1px,transparent 1.1px);background-size:18px 18px}
  .ob-input{transition:border-color .15s,box-shadow .15s}
  .ob-input:focus-within{border-color:var(--ink-strong);box-shadow:0 0 0 3px var(--accent)}
  .ob-btn{transition:background .15s,transform .05s}
  .ob-btn:hover{background:#000}
  .ob-btn:active{transform:translateY(1px)}
  .ob-ghost{transition:border-color .15s,background .15s}
  .ob-ghost:hover{border-color:var(--ink-strong);background:var(--panel-2)}
  .ob-link{transition:opacity .15s}
  .ob-link:hover{opacity:.6}
  .modtile{transition:border-color .15s,background .15s}
  .modtile:hover{border-color:var(--ink-strong)}
  .drop{transition:border-color .15s,background .15s;cursor:pointer}
  .drop:hover{border-color:var(--ink-strong);background:var(--panel-2)}
</style>
</helmet>
<div class="dotfield" style="min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;font-family:var(--font-sans);color:var(--ink);position:relative">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(244,243,239,0),rgba(244,243,239,.45));pointer-events:none"></div>

  <!-- top bar: wordmark + stepper -->
  <div style="position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px 34px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.75);backdrop-filter:blur(12px)">
    <div style="display:flex;align-items:center;gap:9px;flex:none">
      <span style="width:24px;height:24px;background:var(--ink-strong);border-radius:0 8px 0 8px"></span>
      <span style="font-size:19px;font-weight:700;letter-spacing:-.045em;color:var(--ink-strong)">axona</span>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <sc-for list="{{ steps }}" as="s" hint-placeholder-count="3">
        <span style="display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;background:{{ s.bg }};border:1px solid {{ s.bd }}">
          <span style="width:19px;height:19px;border-radius:50%;background:{{ s.numBg }};color:{{ s.numFg }};font-family:var(--font-mono);font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center">{{ s.num }}</span>
          <span style="font-size:12.5px;font-weight:600;color:{{ s.fg }}">{{ s.label }}</span>
        </span>
        <sc-if value="{{ s.arrow }}" hint-placeholder-val="{{ true }}"><span style="width:22px;height:1px;background:var(--line-strong)"></span></sc-if>
      </sc-for>
    </div>
    <span style="font-size:12.5px;color:var(--ink-muted);flex:none">Axona Demo Co</span>
  </div>

  <!-- body -->
  <div class="scarea" style="position:relative;flex:1;overflow-y:auto;padding:34px;display:flex;justify-content:center">
    <div style="width:100%;max-width:860px">

      <div style="text-align:center;margin-bottom:26px">
        <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase">Step 3 of 3 · Enable modules</div>
        <h1 style="font-size:clamp(22px,2.6vw,30px);font-weight:600;letter-spacing:-.03em;margin:10px 0 6px">Turn on what you run.</h1>
        <p style="font-size:14px;color:var(--ink-muted);max-width:52ch;margin:0 auto;line-height:1.5">Every module ships with agents. Start with the defaults — you can enable the rest anytime from the Command Center.</p>
      </div>

      <!-- module enablement grid -->
      <div style="display:flex;flex-direction:column;gap:22px">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
          <div>
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
              <span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase">{{ g.label }}</span>
              <span style="flex:1;height:1px;background:var(--line)"></span>
              <span style="font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)">{{ g.onCount }}</span>
            </div>
            <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
              <sc-for list="{{ g.modules }}" as="m" hint-placeholder-count="4">
                <div class="modtile {{ m.dot }}" style="position:relative;border-radius:12px;padding:14px;min-height:78px;display:flex;flex-direction:column;justify-content:space-between;background:{{ m.bg }};border:1px solid {{ m.bd }}">
                  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
                    <span style="font-size:13.5px;font-weight:600;letter-spacing:-.01em;line-height:1.25">{{ m.name }}</span>
                    <!-- toggle -->
                    <span style="width:32px;height:18px;border-radius:999px;background:{{ m.trackBg }};position:relative;flex:none;transition:background .15s">
                      <span style="position:absolute;top:2px;left:{{ m.knobLeft }};width:14px;height:14px;border-radius:50%;background:{{ m.knobBg }};transition:left .15s"></span>
                    </span>
                  </div>
                  <sc-if value="{{ m.agents }}" hint-placeholder-val="{{ false }}"><span style="font-family:var(--font-mono);font-size:9px;letter-spacing:.03em;color:{{ m.agentFg }}">{{ m.agents }}</span></sc-if>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>

    </div>
  </div>

  <!-- footer nav -->
  <div style="position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 34px;border-top:1px solid var(--line);background:var(--paper)">
    <button class="ob-ghost" style="background:var(--paper);color:var(--ink);border:1px solid var(--line-strong);border-radius:9px;padding:11px 20px;font-size:13.5px;font-weight:600;font-family:var(--font-sans);cursor:pointer">← Back</button>
    <div style="display:flex;align-items:center;gap:8px">
      <sc-for list="{{ dots }}" as="d" hint-placeholder-count="3">
        <span style="width:7px;height:7px;border-radius:50%;background:{{ d }}"></span>
      </sc-for>
    </div>
    <button class="ob-btn" style="display:inline-flex;align-items:center;gap:9px;background:var(--ink-strong);color:#fff;border:none;border-radius:9px;padding:11px 22px;font-size:13.5px;font-weight:600;font-family:var(--font-sans);cursor:pointer">Finish → Command Center</button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const steps = [
      { num:'✓', label:'Profile', done:true, active:false, arrow:true },
      { num:'✓', label:'Team', done:true, active:false, arrow:true },
      { num:'3', label:'Modules', done:false, active:true, arrow:false },
    ].map(s => ({
      num:s.num, label:s.label, arrow:s.arrow,
      bg: s.active ? 'var(--panel)' : 'transparent',
      bd: s.active ? 'var(--line-strong)' : 'transparent',
      fg: (s.active || s.done) ? 'var(--ink)' : 'var(--ink-faint)',
      numBg: s.active ? 'var(--ink-strong)' : (s.done ? 'var(--accent)' : 'var(--panel-2)'),
      numFg: s.active ? '#fff' : (s.done ? 'var(--accent-ink)' : 'var(--ink-faint)'),
    }));

    const mod = (name, on, agents) => {
      const a = agents || null;
      return { name, on, agents: a,
        bg: on ? 'var(--paper)' : 'var(--panel)',
        bd: on ? 'var(--ink-strong)' : 'var(--line)',
        trackBg: on ? 'var(--accent)' : 'var(--line-strong)',
        knobBg: on ? 'var(--ink-strong)' : '#fff',
        knobLeft: on ? '16px' : '2px',
        agentFg: on ? 'var(--ink-muted)' : 'var(--ink-faint)',
      };
    };
    const groupsRaw = [
      { label:'CORE', modules:[ mod('Command Center', true), mod('Agents', true, 'agents on'), mod('Workflows', true), mod('Projects', true), mod('Machines', true) ] },
      { label:'VALUE CHAIN', modules:[ mod('Procurement', true, '6 agents'), mod('Manufacturing', true), mod('Inventory', true), mod('Quality', true), mod('Fulfillment', true, '3 agents'), mod('Sales & CRM', false), mod('Marketing', false) ] },
      { label:'ROBOTICS', modules:[ mod('Fleet', true, '4 agents'), mod('Field Service', true), mod('Engineering', true), mod('Autonomy', false) ] },
      { label:'BACK OFFICE', modules:[ mod('Finance', true, '6 agents'), mod('People', false), mod('Security', false), mod('Legal', false) ] },
    ];
    const groups = groupsRaw.map(g => {
      const on = g.modules.filter(m => m.on).length;
      return { label:g.label, onCount: on + ' / ' + g.modules.length + ' on', modules:g.modules };
    });

    const dots = ['var(--line-strong)', 'var(--line-strong)', 'var(--ink-strong)'];

    return { steps, groups, dots };
  }
}
</script>
</body>
</html>
