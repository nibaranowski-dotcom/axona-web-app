<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./styles.css">
<style>
  body{margin:0}
  ::selection{background:var(--accent)}
  .dotfield{background-color:var(--paper);background-image:radial-gradient(#d9d8d2 1.1px,transparent 1.1px);background-size:18px 18px}
  .rp-input{transition:border-color .15s,box-shadow .15s}
  .rp-input:focus-within{border-color:var(--ink-strong);box-shadow:0 0 0 3px var(--accent)}
  .rp-btn{transition:background .15s,transform .05s}
  .rp-btn:hover{background:#000}
  .rp-btn:active{transform:translateY(1px)}
  .rp-ghost{transition:border-color .15s,background .15s}
  .rp-ghost:hover{border-color:var(--ink-strong);background:var(--panel-2)}
  .rp-link{transition:opacity .15s}
  .rp-link:hover{opacity:.6}
  .eye{transition:color .15s;cursor:pointer}
  .eye:hover{color:var(--ink)}
</style>
</helmet>
<div class="dotfield" style="min-height:100vh;box-sizing:border-box;padding:48px 32px;font-family:var(--font-sans);color:var(--ink);position:relative">
  <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(244,243,239,0),rgba(244,243,239,.5));pointer-events:none"></div>

  <div style="position:relative;display:flex;gap:40px;flex-wrap:wrap;justify-content:center;align-items:flex-start">

    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="4">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;color:var(--ink-faint);text-transform:uppercase;padding-left:2px">{{ c.stateLabel }}</div>

      <div style="width:420px;max-width:88vw;background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.07)">
        <div style="padding:40px 40px 30px">

          <!-- mark -->
          <div style="display:flex;flex-direction:column;align-items:center;gap:13px;margin-bottom:8px">
            <span style="width:32px;height:32px;background:{{ c.markBg }};border-radius:0 10px 0 10px;display:inline-flex;align-items:center;justify-content:center">{{ c.markIcon }}</span>
            <span style="font-size:23px;font-weight:700;letter-spacing:-.045em;color:var(--ink-strong)">axona</span>
          </div>

          <!-- heading -->
          <h1 style="font-size:19px;font-weight:600;letter-spacing:-.02em;text-align:center;margin:16px 0 0">{{ c.title }}</h1>
          <p style="font-size:13px;color:var(--ink-muted);text-align:center;line-height:1.5;margin:8px 0 22px">{{ c.body }}</p>

          <!-- fields -->
          <sc-for list="{{ c.fields }}" as="f" hint-placeholder-count="1">
            <div style="margin-bottom:14px">
              <label style="display:block;font-size:12px;font-weight:600;margin-bottom:6px">{{ f.label }}</label>
              <div class="rp-input" style="display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line-strong);border-radius:9px;padding:0 13px">
                <input value="{{ f.val }}" type="{{ f.type }}" placeholder="{{ f.ph }}" style="flex:1;min-width:0;border:none;outline:none;background:transparent;padding:11px 0;font-size:13.5px;font-family:var(--font-sans);color:var(--ink);letter-spacing:{{ f.spacing }}">
                <sc-if value="{{ f.eye }}" hint-placeholder-val="{{ false }}"><span class="eye" style="display:inline-flex;color:var(--ink-faint)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg></span></sc-if>
              </div>
              <sc-if value="{{ f.hasStrength }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;align-items:center;gap:8px;margin-top:9px">
                  <div style="flex:1;display:flex;gap:4px">
                    <span style="flex:1;height:4px;border-radius:999px;background:var(--accent)"></span>
                    <span style="flex:1;height:4px;border-radius:999px;background:var(--accent)"></span>
                    <span style="flex:1;height:4px;border-radius:999px;background:var(--accent)"></span>
                    <span style="flex:1;height:4px;border-radius:999px;background:var(--skeleton)"></span>
                  </div>
                  <span style="font-family:var(--font-mono);font-size:9.5px;letter-spacing:.05em;color:var(--ink-muted);text-transform:uppercase">Strong</span>
                </div>
              </sc-if>
            </div>
          </sc-for>

          <!-- confirmation block -->
          <sc-if value="{{ c.hasConfirm }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:22px">
              <span style="width:52px;height:52px;border-radius:50%;background:{{ c.confirmBg }};display:inline-flex;align-items:center;justify-content:center">{{ c.confirmIcon }}</span>
            </div>
          </sc-if>

          <!-- primary action -->
          <sc-if value="{{ c.cta }}" hint-placeholder-val="{{ false }}">
            <button class="rp-btn" style="width:100%;background:var(--ink-strong);color:#fff;border:none;border-radius:9px;padding:13px;font-size:14px;font-weight:600;font-family:var(--font-sans);cursor:pointer">{{ c.cta }}</button>
          </sc-if>

          <!-- secondary / resend -->
          <sc-if value="{{ c.resend }}" hint-placeholder-val="{{ false }}">
            <div style="text-align:center;margin-top:16px;font-size:12.5px;color:var(--ink-muted)">Didn't get it? <span style="color:var(--ink-faint)">Resend in {{ c.resend }}</span></div>
          </sc-if>
          <sc-if value="{{ c.ghost }}" hint-placeholder-val="{{ false }}">
            <button class="rp-ghost" style="width:100%;margin-top:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line-strong);border-radius:9px;padding:12px;font-size:13.5px;font-weight:600;font-family:var(--font-sans);cursor:pointer">{{ c.ghost }}</button>
          </sc-if>

        </div>

        <!-- footer -->
        <div style="border-top:1px solid var(--line);background:var(--panel);padding:14px;text-align:center">
          <a href="Login.dc.html" class="rp-link" style="font-size:12.5px;color:var(--ink-muted);text-decoration:none">← Back to log in</a>
        </div>
      </div>
    </div>
    </sc-for>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const R = React.createElement;
    const svg = (stroke, paths) => R('svg', { width:16, height:16, viewBox:'0 0 24 24', fill:'none', stroke, strokeWidth:2, strokeLinecap:'round', strokeLinejoin:'round' }, ...paths.map((d,i)=>R('path',{key:i,d})));
    const svgBig = (stroke, paths) => R('svg', { width:24, height:24, viewBox:'0 0 24 24', fill:'none', stroke, strokeWidth:2.2, strokeLinecap:'round', strokeLinejoin:'round' }, ...paths.map((d,i)=>R('path',{key:i,d})));
    const lock = svg('#c6f24f', ['M7 11V7a5 5 0 0 1 10 0v4']).props ? svg('#c6f24f', ['M7 11V7a5 5 0 0 1 10 0v4']) : null;
    const lockIcon = R('svg',{width:16,height:16,viewBox:'0 0 24 24',fill:'none',stroke:'#c6f24f',strokeWidth:2,strokeLinecap:'round',strokeLinejoin:'round'}, R('rect',{width:18,height:11,x:3,y:11,rx:2}), R('path',{d:'M7 11V7a5 5 0 0 1 10 0v4'}));
    const mail = R('svg',{width:24,height:24,viewBox:'0 0 24 24',fill:'none',stroke:'var(--ink-strong)',strokeWidth:1.8,strokeLinecap:'round',strokeLinejoin:'round'}, R('rect',{width:20,height:16,x:2,y:4,rx:2}), R('path',{d:'m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7'}));
    const check = R('svg',{width:26,height:26,viewBox:'0 0 24 24',fill:'none',stroke:'var(--accent-ink)',strokeWidth:2.6,strokeLinecap:'round',strokeLinejoin:'round'}, R('path',{d:'M20 6 9 17l-5-5'}));

    return {
      cards: [
        { stateLabel:'1 · Request', markBg:'var(--ink-strong)', markIcon:lockIcon,
          title:'Reset your password', body:'Enter your work email and we\u2019ll send a link to reset it.',
          fields:[ { label:'Work email', val:'', type:'email', ph:'you@company.com', spacing:'normal' } ],
          cta:'Send reset link' },

        { stateLabel:'2 · Link sent', markBg:'var(--panel)', markIcon:mail,
          title:'Check your inbox', body:'We sent a reset link to omar@axona.co. It expires in 30 minutes.',
          fields:[], resend:'0:42', ghost:'Open email app' },

        { stateLabel:'3 · Set new password', markBg:'var(--ink-strong)', markIcon:lockIcon,
          title:'Set a new password', body:'Choose a strong password you haven\u2019t used before.',
          fields:[
            { label:'New password', val:'newsecret22', type:'password', ph:'', spacing:'.12em', eye:true, hasStrength:true },
            { label:'Confirm password', val:'newsecret22', type:'password', ph:'', spacing:'.12em', eye:true },
          ],
          cta:'Update password' },

        { stateLabel:'4 · Email verified', markBg:'var(--panel)', markIcon:mail,
          title:'Email verified', body:'You\u2019re all set. Your workspace is ready to go.',
          fields:[], hasConfirm:true, confirmBg:'var(--accent)', confirmIcon:check, cta:'Continue to Axona' },
      ],
    };
  }
}
</script>
</body>
</html>
