<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./styles.css">
<style>
  body{margin:0}
  ::selection{background:var(--accent)}
  .navitem{transition:background .15s,color .15s}
  .navitem:hover{background:var(--panel)}
  .navgroup summary{list-style:none}
  .navgroup summary::-webkit-details-marker{display:none}
  .navchev{transition:transform .15s;flex:none}
  .navgroup:not([open]) .navchev{transform:rotate(-90deg)}
  .nrow{transition:background .15s;cursor:pointer}
  .nrow:hover{background:var(--panel-2)}
  .tab{transition:background .15s,color .15s;cursor:pointer}
  .tab:hover{color:var(--ink)}
  .actbtn{transition:border-color .15s,color .15s;cursor:pointer}
  .actbtn:hover{border-color:var(--ink-strong);color:var(--ink)}
  .scarea::-webkit-scrollbar{width:8px}
  .scarea::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:8px}
</style>
</helmet>
<div style="display:flex;height:100vh;overflow:hidden;font-family:var(--font-sans);color:var(--ink);background:var(--panel)">

  <aside style="width:240px;flex:none;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px">
    <div style="display:flex;align-items:center;gap:8px;padding:4px 8px 18px">
      <span style="font-size:21px;font-weight:700;letter-spacing:-.04em;color:var(--ink-strong)">axona</span>
      <span style="width:12px;height:12px;background:var(--ink-strong);border-radius:0 7px 0 7px"></span>
    </div>
    <a href="Mission Control.dc.html" style="display:flex;align-items:center;gap:9px;margin:0 4px 10px;padding:8px 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel);cursor:pointer;text-decoration:none">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink-faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <span style="flex:1;font-size:13px;color:var(--ink-faint)">Search</span>
      <span style="font-family:var(--font-mono);font-size:9.5px;color:var(--ink-faint);border:1px solid var(--line-strong);border-radius:4px;padding:1px 5px">⌘K</span>
    </a>
    <div class="scarea" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin:0 -4px;padding:0 4px">
      <sc-for list="{{ navGroups }}" as="g" hint-placeholder-count="4">
        <details open="open" class="navgroup">
          <summary style="display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase;padding:14px 10px 6px;cursor:pointer"><span style="flex:1">{{ g.label }}</span><svg class="navchev" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--line-strong)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></summary>
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
          <a class="navitem" href="{{ it.href }}" style="display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;cursor:pointer;background:transparent;color:var(--ink-muted);font-size:14px;text-decoration:none">
            <span style="width:6px;height:6px;border-radius:2px;background:var(--line-strong);flex:none"></span>
            <span style="flex:1">{{ it.name }}</span>
            <sc-if value="{{ it.badge }}" hint-placeholder-val="{{ false }}"><span style="font-family:var(--font-mono);font-size:10px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px;font-weight:600">{{ it.badge }}</span></sc-if>
          </a>
        </sc-for>
        </details>
      </sc-for>
    </div>
    <div style="display:flex;align-items:center;gap:10px;padding:12px 8px 2px;border-top:1px solid var(--line);margin-top:8px">
      <span style="width:28px;height:28px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--accent-ink)">LC</span>
      <div style="font-size:12.5px;line-height:1.3"><div style="font-weight:600">Lauren C.</div><div style="color:var(--ink-faint)">Head of Ops</div></div>
    </div>
  </aside>

  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <div style="height:60px;flex:none;border-bottom:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 24px">
      <div>
        <div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase">Inbox · 4 unread</div>
        <h1 style="margin:2px 0 0;font-size:19px;font-weight:600;letter-spacing:-.02em">Notifications</h1>
      </div>
      <button class="actbtn" style="font-size:12.5px;font-weight:600;font-family:var(--font-sans);color:var(--ink-muted);background:var(--paper);border:1px solid var(--line-strong);border-radius:8px;padding:8px 14px">Mark all read</button>
    </div>

    <!-- tabs -->
    <div style="flex:none;display:flex;align-items:center;gap:6px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--paper)">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
        <span class="tab" style="display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;background:{{ t.bg }};color:{{ t.fg }};border:1px solid {{ t.bd }}">{{ t.label }}<sc-if value="{{ t.count }}" hint-placeholder-val="{{ false }}"><span style="font-family:var(--font-mono);font-size:10px;opacity:.7">{{ t.count }}</span></sc-if></span>
      </sc-for>
    </div>

    <div class="scarea" style="flex:1;min-width:0;overflow-y:auto;padding:8px 24px 24px">
      <div style="max-width:760px;margin:0 auto">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
          <div style="display:flex;align-items:center;gap:12px;margin:18px 0 6px">
            <span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;color:var(--ink-faint);text-transform:uppercase">{{ g.label }}</span>
            <span style="flex:1;height:1px;background:var(--line)"></span>
          </div>
          <sc-for list="{{ g.items }}" as="n" hint-placeholder-count="4">
            <div class="nrow" style="display:flex;align-items:flex-start;gap:13px;padding:14px 14px;border-radius:11px;background:{{ n.rowBg }}">
              <span style="width:34px;height:34px;border-radius:9px;background:{{ n.iconBg }};display:inline-flex;align-items:center;justify-content:center;color:{{ n.iconFg }};flex:none;margin-top:1px">{{ n.icon }}</span>
              <div style="flex:1;min-width:0">
                <div style="font-size:13.5px;color:var(--ink);line-height:1.45">{{ n.summary }}</div>
                <div style="display:flex;align-items:center;gap:8px;margin-top:5px">
                  <span style="font-family:var(--font-mono);font-size:10px;letter-spacing:.03em;color:var(--ink-muted);background:var(--panel);border:1px solid var(--line-panel);border-radius:5px;padding:2px 7px">{{ n.source }}</span>
                  <span style="font-family:var(--font-mono);font-size:10px;color:var(--ink-faint)">{{ n.object }}</span>
                </div>
              </div>
              <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none">
                <span style="font-family:var(--font-mono);font-size:10px;color:var(--ink-faint);white-space:nowrap">{{ n.time }}</span>
                <sc-if value="{{ n.unread }}" hint-placeholder-val="{{ false }}"><span style="width:8px;height:8px;border-radius:50%;background:var(--accent)"></span></sc-if>
              </div>
            </div>
          </sc-for>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    const R = React.createElement;
    const ic = (...p) => R('svg', { width:17, height:17, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:1.9, strokeLinecap:'round', strokeLinejoin:'round' }, ...p.map((d,i)=>R('path',{key:i,d})));
    const icNav = (...p) => R('svg', { width:16, height:16, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:1.8, strokeLinecap:'round', strokeLinejoin:'round' }, ...p.map((d,i)=>R('path',{key:i,d})));
    const icNavR = (rect, ...p) => R('svg', { width:16, height:16, viewBox:'0 0 24 24', fill:'none', stroke:'currentColor', strokeWidth:1.8, strokeLinecap:'round', strokeLinejoin:'round' }, R('rect', rect), ...p.map((d,i)=>R('path',{key:i,d})));

    const navGroups = [
      { label:'Core', items:[ { name:'Command Center', href:'Mission Control.dc.html' }, { name:'Agents', href:'Agents.dc.html' }, { name:'Workflows', href:'Workflows.dc.html' }, { name:'Projects', href:'Projects.dc.html' }, { name:'Machines', href:'Machines.dc.html' } ] },
      { label:'Value chain', items:[ { name:'Procurement', href:'Procurement.dc.html', badge:'6' }, { name:'Manufacturing', href:'Manufacturing.dc.html' }, { name:'Inventory', href:'Inventory.dc.html' }, { name:'Fulfillment', href:'Fulfillment.dc.html', badge:'3' }, { name:'Quality', href:'Quality.dc.html' }, { name:'Sales & CRM', href:'Sales & CRM.dc.html' }, { name:'Marketing', href:'Marketing.dc.html' } ] },
      { label:'Robotics', items:[ { name:'Fleet', href:'Fleet.dc.html' }, { name:'Field Service', href:'Field Service.dc.html' }, { name:'Engineering', href:'Engineering.dc.html' }, { name:'Autonomy', href:'Autonomy.dc.html' } ] },
      { label:'Back office', items:[ { name:'Finance', href:'Finance.dc.html', badge:'6' }, { name:'People', href:'People.dc.html' }, { name:'Security', href:'Security.dc.html' }, { name:'Legal', href:'Legal.dc.html' } ] },
    ];

    const tabsRaw = [ { label:'All', active:true }, { label:'Unread', count:'4' }, { label:'Approvals', count:'2' } ];
    const tabs = tabsRaw.map(t => ({ label:t.label, count:t.count || null,
      bg: t.active ? 'var(--ink-strong)' : 'var(--paper)',
      fg: t.active ? '#fff' : 'var(--ink-muted)',
      bd: t.active ? 'var(--ink-strong)' : 'var(--line-strong)' }));

    // icon glyphs by type
    const G = {
      approval: ic('M9 12l2 2 4-4', 'M21 12c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z'),
      exception: ic('m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z', 'M12 9v4', 'M12 17h.01'),
      run: ic('M12 2v4', 'M12 18v4', 'm4.93 4.93 2.83 2.83', 'm16.24 16.24 2.83 2.83', 'M2 12h4', 'M18 12h4'),
      mention: ic('M12 2a10 10 0 1 0 4 19.2', 'M16 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z', 'M20 12v1a3 3 0 0 1-6 0v-1'),
      cert: ic('M12 15a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', 'm9 15-2 6 5-3 5 3-2-6'),
    };
    const style = (t) => t==='exception' ? { iconBg:'var(--ink-strong)', iconFg:'#fff' }
      : t==='approval' ? { iconBg:'var(--accent)', iconFg:'var(--accent-ink)' }
      : { iconBg:'var(--panel-2)', iconFg:'var(--ink-muted)' };
    const mk = (type, summary, source, object, time, unread) => ({
      icon: G[type], ...style(type), summary, source, object, time, unread,
      rowBg: unread ? 'rgba(198,242,79,.07)' : 'transparent',
    });

    const groups = [
      { label:'Today', items:[
        mk('approval', 'PO-9007 is awaiting your approval — $48,200 to Vendor A.', 'Procurement', 'PO-9007', '9m', true),
        mk('exception', 'Autonomy regression at Site-3 — takeovers up since the p-13 canary.', 'Autonomy', 'Site-3 · p-13', '41m', true),
        mk('run', 'Workflow “Procurement reorder” parked — needs a spend-policy decision.', 'Workflows', 'WF-04', '1h', true),
        mk('cert', 'M. Osei’s HV/battery cert expires in 12 days — gates Site-2 dispatch.', 'People', 'M. Osei', '2h', true),
      ] },
      { label:'Earlier', items:[
        mk('approval', 'ECO-318 approved by Omar Haddad — drive change released.', 'Engineering', 'ECO-318', 'Yesterday', false),
        mk('mention', 'Dana Reyes mentioned you on the BMW deliverability note.', 'Sales & CRM', 'BMW · INV-2208', 'Yesterday', false),
        mk('exception', 'DLV-3312 cleared Osaka customs — back on schedule.', 'Fulfillment', 'DLV-3312', '2 days ago', false),
        mk('run', 'Nightly reconciliation completed — 312 SKUs, 0 variances.', 'Inventory', 'CYCLE-0705', '2 days ago', false),
      ] },
    ];

    return { navGroups, tabs, groups };
  }
}
</script>
</body>
</html>
