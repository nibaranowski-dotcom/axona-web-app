<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="./styles.css">
<style>
  body{margin:0}
  @keyframes sk-pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .sk{background:var(--skeleton,#ececE8);border-radius:7px;animation:sk-pulse 1.4s ease-in-out infinite}
  .sk-soft{background:var(--panel-2,#ecebe6);border-radius:8px;animation:sk-pulse 1.4s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.sk,.sk-soft{animation:none;opacity:.8}}
</style>
</helmet>
<div style="display:flex;height:100vh;overflow:hidden;font-family:var(--font-sans);background:var(--panel)">

  <!-- sidebar skeleton -->
  <aside style="width:240px;flex:none;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 14px">
    <div style="display:flex;align-items:center;gap:8px;padding:4px 8px 18px">
      <span style="font-size:21px;font-weight:700;letter-spacing:-.04em;color:var(--ink-strong)">axona</span>
      <span style="width:12px;height:12px;background:var(--ink-strong);border-radius:0 7px 0 7px"></span>
    </div>
    <div class="sk-soft" style="height:38px;margin:0 4px 16px"></div>
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
      <div class="sk" style="width:78px;height:9px;margin:16px 10px 10px"></div>
      <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;gap:11px;padding:9px 10px">
          <span class="sk" style="width:6px;height:6px;border-radius:2px;flex:none"></span>
          <span class="sk" style="height:11px;width:{{ r }}"></span>
        </div>
      </sc-for>
    </sc-for>
    <div style="margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 2px;border-top:1px solid var(--line)">
      <span class="sk" style="width:28px;height:28px;border-radius:50%;flex:none"></span>
      <div style="flex:1;display:flex;flex-direction:column;gap:5px"><span class="sk" style="height:10px;width:70%"></span><span class="sk" style="height:8px;width:45%"></span></div>
    </div>
  </aside>

  <!-- main column skeleton -->
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel)">
    <div style="height:60px;flex:none;border-bottom:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 24px">
      <div style="display:flex;flex-direction:column;gap:7px"><span class="sk" style="height:9px;width:120px"></span><span class="sk" style="height:15px;width:190px"></span></div>
      <div style="display:flex;gap:10px"><span class="sk" style="height:32px;width:110px;border-radius:8px"></span><span class="sk-soft" style="height:32px;width:120px;border-radius:8px"></span></div>
    </div>

    <div style="flex:1;overflow:hidden;padding:22px 24px;display:flex;flex-direction:column;gap:18px">
      <!-- stat strip -->
      <div style="display:flex;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden">
        <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4">
          <div style="flex:1;padding:16px 18px;border-left:{{ s }};display:flex;flex-direction:column;gap:9px"><span class="sk" style="height:20px;width:64px"></span><span class="sk" style="height:9px;width:88px"></span></div>
        </sc-for>
      </div>
      <!-- hero card -->
      <div style="background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;justify-content:space-between"><span class="sk" style="height:14px;width:180px"></span><span class="sk" style="height:12px;width:90px"></span></div>
        <sc-for list="{{ bars }}" as="b" hint-placeholder-count="4">
          <div style="display:flex;flex-direction:column;gap:7px"><span class="sk" style="height:10px;width:{{ b }}"></span><span class="sk-soft" style="height:9px;width:100%;border-radius:999px"></span></div>
        </sc-for>
      </div>
      <!-- table card -->
      <div style="flex:1;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:0">
        <span class="sk" style="height:14px;width:150px;margin-bottom:16px"></span>
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
          <div style="display:flex;align-items:center;gap:16px;padding:13px 0;border-top:1px solid var(--line)">
            <span class="sk" style="width:30px;height:30px;border-radius:8px;flex:none"></span>
            <span class="sk" style="height:11px;flex:2"></span>
            <span class="sk" style="height:11px;flex:1"></span>
            <span class="sk" style="height:11px;flex:1"></span>
            <span class="sk-soft" style="height:20px;width:76px;border-radius:999px;flex:none"></span>
          </div>
        </sc-for>
      </div>
    </div>
  </div>

  <!-- agent pane skeleton -->
  <div style="width:360px;flex:none;background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column">
    <div style="height:60px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 18px">
      <span class="sk" style="width:30px;height:30px;border-radius:50%;flex:none"></span>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px"><span class="sk" style="height:12px;width:60%"></span><span class="sk" style="height:8px;width:40%"></span></div>
    </div>
    <div style="padding:14px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px">
      <sc-for list="{{ avatars }}" as="a" hint-placeholder-count="6"><span class="sk" style="width:22px;height:22px;border-radius:50%;flex:none"></span></sc-for>
    </div>
    <div style="flex:1;padding:18px;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;gap:9px"><span class="sk" style="width:22px;height:22px;border-radius:50%;flex:none"></span><span class="sk-soft" style="height:56px;width:80%;border-radius:13px"></span></div>
      <div style="display:flex;justify-content:flex-end"><span class="sk" style="height:38px;width:60%;border-radius:13px"></span></div>
      <div style="display:flex;gap:9px"><span class="sk" style="width:22px;height:22px;border-radius:50%;flex:none"></span><span class="sk-soft" style="height:44px;width:70%;border-radius:13px"></span></div>
    </div>
    <div style="padding:12px 18px 16px;border-top:1px solid var(--line)"><span class="sk-soft" style="display:block;height:42px;border-radius:10px"></span></div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals(){
    return {
      groups: [ { rows:['62%','48%','70%','54%','58%'] }, { rows:['66%','52%','44%','72%'] }, { rows:['50%','60%','46%'] } ],
      stats: ['none','1px solid var(--line)','1px solid var(--line)','1px solid var(--line)'],
      bars: ['46%','62%','38%','54%'],
      rows: [0,1,2,3,4],
      avatars: [0,1,2,3,4,5],
    };
  }
}
</script>
</body>
</html>
